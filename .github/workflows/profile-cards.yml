name: Profile cards

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate the cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: evgeha52
          BRANCH_NAME: profile-summary-card-output
          UTC_OFFSET: 3
          THEME: dark