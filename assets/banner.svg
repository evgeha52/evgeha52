<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Evgeniy — backend, frontend and infrastructure">
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#151b21"/>
    </pattern>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="300" rx="18" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#0a0c0f" />
    <rect width="1200" height="300" fill="url(#grid)" />

    <!-- signature: measured rail, accent for the lit segment -->
    <rect x="0" y="0" width="4" height="104" fill="#19b9f1" />
    <rect x="0" y="104" width="4" height="196" fill="#272d35" />

    <text x="64" y="120" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="54" font-weight="600" letter-spacing="-1.6" fill="#f4f7fa">Evgeniy</text>

    <text x="64" y="156" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="19" fill="#b6c1cd">Backend, frontend and infrastructure</text>

    <text x="64" y="206" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace"
          font-size="12" letter-spacing="2.4" fill="#8d97a5">PYTHON · GO · TYPESCRIPT · POSTGRESQL · DOCKER</text>

    <rect x="828" y="70" width="308" height="160" rx="12" fill="#111419" stroke="#272d35" />
    <rect x="852" y="96" width="2" height="108" fill="#19b9f1" opacity="0.55" />

    <text x="872" y="106" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace"
          font-size="10" letter-spacing="2" fill="#8d97a5">ROLE</text>
    <text x="872" y="128" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="18" font-weight="600" fill="#f4f7fa">Engineer</text>

    <text x="872" y="156" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace"
          font-size="10" letter-spacing="2" fill="#8d97a5">FOCUS</text>
    <text x="872" y="178" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="15" fill="#b6c1cd">Product systems</text>

    <text x="872" y="204" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace"
          font-size="10" letter-spacing="2" fill="#8d97a5">MODE</text>
    <text x="928" y="204" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="13" fill="#19b9f1">building</text>
  </g>
</svg>